<svg class="legchart" viewBox="0 0 820 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two line charts, one per leg, showing percent change from November 2025 in leg lean mass and in force. Muscle fell on both legs while force rose on both.">
<rect width="820" height="840" rx="6" fill="#0b0b10"/>
<text x="44" y="56" font-family="'Antonio',Impact,'Arial Narrow',sans-serif" font-size="40" font-weight="600" fill="#ececff" style="text-transform:uppercase;letter-spacing:-.01em">Muscle and force do not move together.</text>
<text x="44" y="86" font-family="'Inter Tight','IBM Plex Sans',system-ui,-apple-system,sans-serif" font-size="16" fill="#a3a3b3">My legs, November 2025 to August 2026. Muscle down on both. Force up on both.</text>
